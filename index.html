<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엔젤 레기온 - AION2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-overlay"></div>
    <div class="container">
        <header class="hero">
            <div class="title-wrapper">
                <div class="star-deco">✦</div>
                <h1>ANGEL LEGION</h1>
                <div class="star-deco">✦</div>
            </div>
            <p class="tagline">함께 날아오를 동료를 찾습니다</p>
        </header>
        
        <main class="content">
            <div class="card">
                <div class="card-header">
                    <span class="icon">⚔️</span>
                    <h2>모집 조건</h2>
                </div>
                <div class="card-body">
                    <div class="stat">
                        <span class="label">전투력</span>
                        <span class="value">200K+</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="icon">🎯</span>
                    <h2>활동 내용</h2>
                </div>
                <div class="card-body">
                    <div class="activity-item">
                        <span class="bullet">✦</span>
                        <span>루드라 레기온파티</span>
                    </div>
                    <div class="activity-item">
                        <span class="bullet">✦</span>
                        <span>침식 레기온파티</span>
                    </div>
                    <div class="activity-item">
                        <span class="bullet">✦</span>
                        <span>디스코드 / 카카오톡 채팅방 운영중</span>
                    </div>
                </div>
            </div>

            <div class="cta-section">
                <a href="KAKAO_LINK_HERE" class="join-btn" target="_blank">
                    <span class="btn-glow"></span>
                    <span class="btn-text">지금 참여하기</span>
                </a>
            </div>
        </main>
        
        <footer>
            <p>ANGEL LEGION © 2026</p>
        </footer>
    </div>
</body>
</html>
